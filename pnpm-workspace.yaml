packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: true
  cpu-features: false
  esbuild: true
  msw: true
  protobufjs: false
  ssh2: false
  terriajs: true

minimumReleaseAgeExclude:
  - terriajs-cesium-widgets@16.2.0
  - terriajs-cesium@26.3.0
overrides:
  "@types/react": ^18.3.3
  "@types/react-dom": ^18.3.1
