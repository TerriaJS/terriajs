name: Design system Chromatic

# Snapshots the stories, in light and dark, for visual review. Settings are in
# chromatic.config.json, shared with `pnpm chromatic`
on:
  push:
    branches: [main]
    paths:
      - "packages/design-system/**"
      - ".github/workflows/design-system-*.yml"
      - ".github/scripts/design-system/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "knip.json"
  pull_request:
    paths:
      - "packages/design-system/**"
      - ".github/workflows/design-system-*.yml"
      - ".github/scripts/design-system/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "knip.json"

permissions:
  contents: read
  # GitHub Packages, which pnpm checks the lockfile against
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to release commits
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TurboSnap compares against earlier builds' commits
          fetch-depth: 0
          persist-credentials: false

      # Reads pnpm from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@terriajs"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter . --filter "@terria/design-system*..."

      - uses: chromaui/action@c93e0bc3a63aa176e14a75b61a31847cbfdd341c # v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          configFile: packages/design-system/chromatic.config.json
          storybookBaseDir: packages/design-system/storybook
          storybookConfigDir: packages/design-system/storybook/.storybook
