# This is a basic workflow to help you get started with Actions

name: CI
env:
  NODE_OPTIONS: "--max_old_space_size=4096"

# Controls when the action will run.
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id  }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check formatting with prettier
        run: pnpm prettier-check

      # Root README.md mirrors packages/terriajs/README.md (interim parity: same
      # content on the GitHub repo page and the npm terriajs page). Fail if the mirror
      # is stale — run `pnpm sync-readme` after editing the package README.
      - name: Check README parity
        run: pnpm sync-readme && git diff --exit-code -- README.md

      - name: Build TerriaJS tests
        run: pnpm --filter terriajs exec gulp lint build --continue
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Run tests using xvfb
        run: xvfb-run --auto-servernum pnpm --filter terriajs exec gulp test-firefox
